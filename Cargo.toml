[package]
name = "qr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = "0.12.0"
image = "0.25.10"
linkify = "0.11.0"
nokhwa = { version = "0.10.11", features = ["input-avfoundation", "output-threaded"] }
rqrr = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
qrcode = "0.14.1"
